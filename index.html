<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pintar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .btn-active:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-sm bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700 flex flex-col h-[620px]">
        
        <!-- Header -->
        <div class="px-6 pt-5 pb-2 flex justify-between items-center text-slate-400 text-sm">
            <span class="font-semibold tracking-wider text-slate-300">KALKULATOR</span>
            <button id="btn-history" class="hover:text-amber-400 transition">
                <i class="fa-solid me-1 fa-history"></i> Riwayat
            </button>
        </div>

        <!-- Display Area -->
        <div class="px-6 py-4 flex-1 flex flex-col justify-end text-right bg-slate-850 relative">
            <!-- Modal Riwayat -->
            <div id="history-modal" class="absolute inset-0 bg-slate-800/95 p-4 hidden flex-col z-10 overflow-y-auto">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-700">
                    <span class="text-sm font-bold text-amber-400">Riwayat Perhitungan</span>
                    <button id="close-history" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="history-list" class="flex-1 text-sm text-slate-300 space-y-2 flex flex-col justify-end">
                    <p class="text-xs text-slate-500 text-center italic">Belum ada riwayat</p>
                </div>
                <button id="clear-history" class="mt-3 text-xs text-red-400 hover:underline text-center">Hapus Riwayat</button>
            </div>

            <!-- Expression & Main Result -->
            <div id="expression" class="text-slate-400 text-lg h-7 overflow-x-auto whitespace-nowrap scrollbar-none mb-1"></div>
            <div id="display" class="text-4xl font-bold tracking-tight overflow-x-auto whitespace-nowrap scrollbar-none text-amber-400">0</div>
        </div>

        <!-- Keypad -->
        <div class="p-4 grid grid-cols-4 gap-3 bg-slate-800/80 border-t border-slate-700/50">
            <!-- Row 1 -->
            <button onclick="clearAll()" class="btn-active bg-red-500/20 text-red-400 font-semibold p-4 rounded-2xl hover:bg-red-500/30 transition text-xl">AC</button>
            <button onclick="deleteLast()" class="btn-active bg-slate-700 text-amber-400 p-4 rounded-2xl hover:bg-slate-600 transition text-xl"><i class="fa-solid fa-backspace"></i></button>
            <button onclick="appendOperator('%')" class="btn-active bg-slate-700 text-amber-400 font-semibold p-4 rounded-2xl hover:bg-slate-600 transition text-xl">%</button>
            <button onclick="appendOperator('/')" class="btn-active bg-amber-500 text-white font-semibold p-4 rounded-2xl hover:bg-amber-600 transition text-xl">÷</button>

            <!-- Row 2 -->
            <button onclick="appendNumber('7')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">7</button>
            <button onclick="appendNumber('8')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">8</button>
            <button onclick="appendNumber('9')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">9</button>
            <button onclick="appendOperator('*')" class="btn-active bg-amber-500 text-white font-semibold p-4 rounded-2xl hover:bg-amber-600 transition text-xl">×</button>

            <!-- Row 3 -->
            <button onclick="appendNumber('4')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">4</button>
            <button onclick="appendNumber('5')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">5</button>
            <button onclick="appendNumber('6')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">6</button>
            <button onclick="appendOperator('-')" class="btn-active bg-amber-500 text-white font-semibold p-4 rounded-2xl hover:bg-amber-600 transition text-xl">−</button>

            <!-- Row 4 -->
            <button onclick="appendNumber('1')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">1</button>
            <button onclick="appendNumber('2')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">2</button>
            <button onclick="appendNumber('3')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">3</button>
            <button onclick="appendOperator('+')" class="btn-active bg-amber-500 text-white font-semibold p-4 rounded-2xl hover:bg-amber-600 transition text-xl">+</button>

            <!-- Row 5 -->
            <button onclick="toggleSign()" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">±</button>
            <button onclick="appendNumber('0')" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">0</button>
            <button onclick="appendDot()" class="btn-active bg-slate-700/50 text-white font-medium p-4 rounded-2xl hover:bg-slate-600 transition text-xl">.</button>
            <button onclick="calculate()" class="btn-active bg-amber-500 text-white font-bold p-4 rounded-2xl hover:bg-amber-600 transition text-xl shadow-lg shadow-amber-500/20">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let currentExpression = '';
        let history = [];
        let isEvaluated = false;

        const displayEl = document.getElementById('display');
        const expressionEl = document.getElementById('expression');
        const historyModal = document.getElementById('history-modal');
        const historyList = document.getElementById('history-list');

        function updateDisplay() {
            displayEl.innerText = currentInput;
            expressionEl.innerText = currentExpression;
        }

        function appendNumber(num) {
            if (isEvaluated) {
                currentInput = num;
                currentExpression = '';
                isEvaluated = false;
            } else {
                if (currentInput === '0') {
                    currentInput = num;
                } else {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendDot() {
            if (isEvaluated) {
                currentInput = '0.';
                currentExpression = '';
                isEvaluated = false;
            } else if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput !== '0') {
                if (currentInput.startsWith('-')) {
                    currentInput = currentInput.slice(1);
                } else {
                    currentInput = '-' + currentInput;
                }
                updateDisplay();
            }
        }

        function appendOperator(op) {
            if (isEvaluated) {
                currentExpression = currentInput + ' ' + op + ' ';
                currentInput = '0';
                isEvaluated = false;
            } else {
                currentExpression += currentInput + ' ' + op + ' ';
                currentInput = '0';
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            currentExpression = '';
            isEvaluated = false;
            updateDisplay();
        }

        function deleteLast() {
            if (isEvaluated) return;
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculate() {
            if (isEvaluated || currentExpression === '') return;

            let fullExpression = currentExpression + currentInput;
            let formattedExpression = fullExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/%/g, '/100');

            try {
                // Safety calculation wrapper
                let result = eval(formattedExpression);
                
                // Limit decimal places
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(8));
                }

                let historyItem = `${fullExpression} = ${result}`;
                history.push(historyItem);
                renderHistory();

                currentExpression = fullExpression + ' =';
                currentInput = String(result);
                isEvaluated = true;
                updateDisplay();
            } catch (error) {
                displayEl.innerText = 'Error';
                setTimeout(clearAll, 1500);
            }
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-xs text-slate-500 text-center italic">Belum ada riwayat</p>';
                return;
            }
            historyList.innerHTML = history.map(item => `<div class="bg-slate-700/40 p-2 rounded text-right border-r-2 border-amber-400">${item}</div>`).join('');
        }

        // Event Listeners for History Modal
        document.getElementById('btn-history').addEventListener('click', () => {
            historyModal.classList.remove('hidden');
            historyModal.classList.add('flex');
        });

        document.getElementById('close-history').addEventListener('click', () => {
            historyModal.classList.add('hidden');
            historyModal.classList.remove('flex');
        });

        document.getElementById('clear-history').addEventListener('click', () => {
            history = [];
            renderHistory();
        });
    </script>
</body>
</html>
